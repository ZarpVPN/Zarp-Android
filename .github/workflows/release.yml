name: Release

# Push a tag like v0.1.0 to build a signed APK and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# the same tag pushed twice must not publish twice in parallel
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.1.0 ndk;29.0.14206865

      - uses: gradle/actions/setup-gradle@v6

      - name: Fetch verified Xray integration-test server
        run: sh scripts/fetch-test-xray.sh "$RUNNER_TEMP/zarp-test-xray" linux

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ZARP_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ZARP_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ZARP_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ZARP_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE STORE_PASS ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then echo "::error::signing secret for $v is not set"; exit 1; fi
          done

      - name: Decode keystore
        run: echo "${{ secrets.ZARP_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/zarp-release.jks"

      - name: Test and lint
        run: ./gradlew test lint --console=plain

      - name: Go core - vet and integration tests
        working-directory: core
        run: |
          test -z "$(gofmt -l zarpcore third_party/usque/pub)"
          go vet -tags=with_quic,with_utls,http2legacy ./zarpcore
          go test -tags=with_quic,with_utls,http2legacy ./zarpcore

      - name: Build signed release APK
        env:
          ZARP_KEYSTORE_FILE: ${{ runner.temp }}/zarp-release.jks
          ZARP_KEYSTORE_PASSWORD: ${{ secrets.ZARP_KEYSTORE_PASSWORD }}
          ZARP_KEY_ALIAS: ${{ secrets.ZARP_KEY_ALIAS }}
          ZARP_KEY_PASSWORD: ${{ secrets.ZARP_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease --console=plain \
            -Pzarp.versionName="$VERSION" \
            -Pzarp.versionCode="${{ github.run_number }}"

      - name: Verify signature and rename
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/Zarp-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # release already exists (tag pushed again, or created on the web): replace the files, keep the notes
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Zarp for Android $GITHUB_REF_NAME" --generate-notes
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/zarp-release.jks"
